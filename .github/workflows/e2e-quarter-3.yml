name: E2E quarter 3

on:
  workflow_call:

jobs:
  e2e:
    name: E2E quarter 3 of 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bunx playwright install chromium
      - run: >-
          nix develop --command firebase emulators:exec
          --project roborally-e2e --only auth,firestore
          "playwright test --shard=3/4"
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-quarter-3
          path: playwright-report/
          retention-days: 30
